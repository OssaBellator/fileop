name: build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/FileOp.Core/FileOp.Core.csproj --configuration Release
      - run: dotnet build benchmarks/FileOp.Benchmarks/FileOp.Benchmarks.csproj --configuration Release

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/FileOp.Windows/FileOp.Windows.csproj --configuration Release
      - run: dotnet build src/FileOp.Indexer/FileOp.Indexer.csproj --configuration Release -p:Platform=x64
      - run: dotnet test tests/FileOp.Windows.Tests/FileOp.Windows.Tests.csproj --configuration Release
      - run: dotnet build src/FileOp.App/FileOp.App.csproj --configuration Release -p:Platform=x64
