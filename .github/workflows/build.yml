name: build

on:
  push:
    branches: [main, "agent/**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/FileOp.Core/FileOp.Core.csproj --configuration Release
      - run: dotnet build benchmarks/FileOp.Benchmarks/FileOp.Benchmarks.csproj --configuration Release

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/FileOp.Windows/FileOp.Windows.csproj --configuration Release
      - run: dotnet build src/FileOp.Indexer/FileOp.Indexer.csproj --configuration Release -p:Platform=x64
      - run: dotnet test tests/FileOp.Windows.Tests/FileOp.Windows.Tests.csproj --configuration Release
        env:
          FILEOP_INDEXER_PATH: ${{ github.workspace }}\\src\\FileOp.Indexer\\bin\\x64\\Release\\net10.0-windows10.0.17763.0\\FileOp.Indexer.exe
      - run: dotnet build src/FileOp.App/FileOp.App.csproj --configuration Release -p:Platform=x64
      - name: Verify bundled indexer host
        shell: pwsh
        run: |
          $directory = "${{ github.workspace }}\\src\\FileOp.App\\bin\\x64\\Release\\net10.0-windows10.0.26100.0"
          $required = @(
            "FileOp.Indexer.exe",
            "FileOp.Indexer.dll",
            "FileOp.Indexer.deps.json",
            "FileOp.Indexer.runtimeconfig.json"
          )
          foreach ($name in $required) {
            $path = Join-Path $directory $name
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing bundled indexing helper artifact: $path"
            }
          }

          $env:FILEOP_INDEXER_PATH = Join-Path $directory "FileOp.Indexer.exe"
          dotnet test tests/FileOp.Windows.Tests/FileOp.Windows.Tests.csproj `
            --configuration Release `
            --no-build `
            --filter IndexerProcessSessionCompletesRealHostHandshake
